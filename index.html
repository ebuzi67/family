<!doctype html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>우리 가족 대시보드</title>
<meta name="theme-color" content="#e9f0fa">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=10">
</head>
<body class="notranslate theme-kid">
<div id="stage">
  <!-- 왼쪽 메뉴 -->
  <nav id="side">
    <img class="logo" src="img/icon-192.png" alt="">
    <button data-tab="home" class="on" title="대시보드"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8M5 9.5V20h5v-6h4v6h5V9.5"/></svg><span>홈</span></button>
    <button data-tab="village" title="동물 마을"><svg viewBox="0 0 24 24"><circle cx="6" cy="9" r="2.2"/><circle cx="10" cy="5.5" r="2.2"/><circle cx="14.5" cy="5.5" r="2.2"/><circle cx="18" cy="9" r="2.2"/><path d="M12 11c-3.5 0-6 4.5-6 7 0 1.8 1.6 2.5 3 2 1.4-.5 2-.8 3-.8s1.6.3 3 .8c1.4.5 3-.2 3-2 0-2.5-2.5-7-6-7z"/></svg><span>마을</span></button>
    <button data-tab="sticker" title="스티커"><svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg><span>스티커</span></button>
    <button data-tab="trip" title="여행"><svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="13" rx="3"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M4 12h16"/></svg><span>여행</span></button>
    <button data-act="music" id="musicBtn" title="음악"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg><span>음악</span></button>
    <div class="grow1"></div>
    <button data-act="mode" id="modeBtn" title="화면 모드"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg><span id="modeTxt">자동</span></button>
    <button data-tab="settings" title="설정"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M4.2 5.6l2.1 2.1M17.7 16.3l2.1 2.1M2.5 12h3M18.5 12h3M4.2 18.4l2.1-2.1M17.7 7.7l2.1-2.1"/></svg><span>설정</span></button>
  </nav>

  <!-- 대시보드 -->
  <section id="page-home" class="page on">
    <div class="main">
      <header class="head">
        <div><div class="date" id="dateText"></div><div class="time"><span id="ampm"></span><b id="timeText"></b></div></div>
      </header>
      <div class="card hero" id="hero"></div>
      <div class="missions" id="missions"></div>
      <div class="row">
        <div class="card days2" id="days2"></div>
        <div class="card shop" id="shop"></div>
        <div class="card status" id="status"></div>
      </div>
    </div>
    <aside class="aside">
      <div class="card weather" id="weather"></div>
      <div class="calwrap"><i class="clip l"></i><i class="clip r"></i><div class="card cal" id="cal"></div></div>
      <div class="card dday" id="dday"></div>
      <div class="data" id="data"></div>
    </aside>
  </section>

  <!-- 동물 마을 -->
  <section id="page-village" class="page">
    <div class="vwrap">
      <div class="card grow" id="grow"></div>
      <div class="vright">
        <div class="card village" id="village"></div>
        <div class="card recent" id="recent"></div>
      </div>
    </div>
  </section>

  <section id="page-sticker" class="page"><div class="card full" id="stickerPage"></div></section>
  <section id="page-trip" class="page"><div class="card full" id="tripPage"></div></section>
  <section id="page-settings" class="page"><div class="card full scroll" id="settingsPage"></div></section>

  <div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
  <div id="toast" class="toast hidden"></div>
  <div id="night" class="night hidden"></div>
</div>
<script src="app.js?v=10"></script>
</body>
</html>
